spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/order_settlement?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.placeholders.identifierCollation=CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_as_cs
spring.flyway.placeholders.tableOptions=ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_as_cs
