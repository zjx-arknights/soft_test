spring.application.name=order-settlement
spring.profiles.default=local
server.port=${PORT:8080}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.identifierCollation=
spring.flyway.placeholders.tableOptions=
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.arg-name-based-constructor-auto-mapping=true
